name: Deploy to GitHub Pages

# Runs only on pushes to main (not on PRs).
# The lint workflow must pass first since it also runs on push to main.
on:
  push:
    branches: [main]

# Allow the workflow to write to GitHub Pages
permissions:
  contents: read
  pages:    write
  id-token: write

# Only allow one deployment at a time; cancel any in-progress run
concurrency:
  group:              pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repo root — index.html, styles.css, src/, lib/, assets/
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
